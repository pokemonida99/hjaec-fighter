<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>紅分子 亮車快打</title>
<meta name="description" content="復古像素風打車小遊戲：把髒車打到發亮！紅分子 HJAEC 汽車美容。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22 shape-rendering=%22crispEdges%22%3E%3Crect x=%224%22 y=%224%22 width=%228%22 height=%223%22 fill=%22%23cf1f2a%22/%3E%3Crect x=%221%22 y=%227%22 width=%2214%22 height=%224%22 fill=%22%23cf1f2a%22/%3E%3Crect x=%223%22 y=%2210%22 width=%223%22 height=%223%22 fill=%22%23111%22/%3E%3Crect x=%2210%22 y=%2210%22 width=%223%22 height=%223%22 fill=%22%23111%22/%3E%3Crect x=%225%22 y=%225%22 width=%226%22 height=%222%22 fill=%22%239fd0ff%22/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/icon1-180.png">
<link rel="manifest" href="icons/manifest1.webmanifest">
<meta name="apple-mobile-web-app-title" content="亮車快打">
<script src="js/homeicon.js?v=18" data-key="hjaec-homeicon" data-names="紅底,白底,黑底,亮紅" data-accent="#c81e28" data-bg="#160006" data-font="'Cubic','PingFang TC',sans-serif"></script>
<style>
  @font-face { font-family: 'Cubic'; src: url('fonts/Cubic_11.woff2') format('woff2'); font-display: block; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; }
  /* 全部元素都不能選取、長按不跳選單、點擊不閃藍框；圖片不能拖曳 */
  *, *::before, *::after { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  img, canvas { -webkit-user-drag: none; user-drag: none; }
  .btn, .pad, #game, button { touch-action: none; }
  #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }

  /* 桌墊：遊戲畫面下方的出招表 */
  #mat { height: 150px; max-width: 100vw; box-sizing: border-box; font-family: 'Cubic', 'PingFang TC', sans-serif; color: #eee;
    background: repeating-linear-gradient(135deg, #160006 0 14px, #1e0009 14px 28px); border: 3px solid #c81e28; border-radius: 6px;
    display: flex; flex-direction: column; overflow: hidden; user-select: none; }
  .mat-head { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 3px 10px; font-size: 13px;
    color: #ffd040; letter-spacing: 2px; background: linear-gradient(#c81e28, #7a0e14); text-shadow: 0 2px 0 #000; }
  .mat-head button { font: inherit; font-size: 11px; color: #fff; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.4); border-radius: 4px; padding: 1px 8px; cursor: pointer; letter-spacing: 0; }
  .mat-head { gap: 6px; } .mat-head span { white-space: nowrap; flex: none; }
  @media (max-width: 440px) { .mat-head { letter-spacing: 0; padding: 3px 6px; } .mat-head button { padding: 1px 5px; } }
  .mat-body { touch-action: pan-x; flex: 1; display: flex; gap: 6px; padding: 6px; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
  .card { flex: none; width: 168px; background: rgba(0,0,0,.6); border: 1px solid #4a1a22; border-radius: 4px; padding: 5px 7px; font-size: 11px; line-height: 1.45; }
  .card.on { border-color: #ffd040; box-shadow: 0 0 0 1px #ffd040 inset; background: rgba(90,0,16,.7); }
  .card .top { display: flex; gap: 6px; align-items: center; margin-bottom: 3px; }
  .card img { width: 30px; height: 30px; image-rendering: pixelated; border: 1px solid #ffd040; background: #300; }
  .card .nm { font-size: 14px; color: #fff; }
  .card .nm small { display: block; font-size: 10px; color: #ff8080; }
  .card.basic { width: 210px; }
  .card.basic .nm { color: #ffd040; margin-bottom: 4px; }
  .card ul { list-style: none; margin: 0; padding: 0; }
  .card li { white-space: nowrap; }
  .card b { display: inline-block; min-width: 74px; color: #9ad8ff; font-weight: normal; }
  body.mat-off .mat-body { display: none; }
  body.mat-off #mat { height: auto; }
  body.touch:not(.portrait) #mat { display: none; }
  body.touch.portrait #wrap { justify-content: flex-start; gap: 54px; }
  body.touch.portrait #mat { width: 100vw; height: 170px; border-left: none; border-right: none; border-radius: 0; }
  #game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
  body.portrait #wrap { align-items: flex-start; padding-top: max(env(safe-area-inset-top), 12px); }

  /* 觸控按鍵：只在觸控裝置顯示 */
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; font-family: 'Cubic', sans-serif; }
  body.touch #touch { display: block; }
  .pad { position: absolute; left: max(env(safe-area-inset-left), 18px); bottom: max(env(safe-area-inset-bottom), 18px);
    width: 150px; height: 150px; border-radius: 50%; pointer-events: auto;
    background: radial-gradient(circle, rgba(255,255,255,.10) 0 30%, rgba(255,255,255,.05) 31% 100%);
    border: 2px solid rgba(255,255,255,.25); }
  .pad i { position: absolute; width: 0; height: 0; border: 10px solid transparent; opacity: .55; }
  .pad .u { left: 65px; top: 10px; border-bottom-color: #fff; }
  .pad .d { left: 65px; bottom: 10px; border-top-color: #fff; }
  .pad .l { top: 65px; left: 10px; border-right-color: #fff; }
  .pad .r { top: 65px; right: 10px; border-left-color: #fff; }
  .pad .knob { position: absolute; width: 54px; height: 54px; border-radius: 50%; left: 48px; top: 48px;
    background: rgba(230,40,50,.55); border: 2px solid rgba(255,255,255,.5); transition: transform .05s; }
  .btns { position: absolute; right: max(env(safe-area-inset-right), 14px); bottom: max(env(safe-area-inset-bottom), 14px);
    width: 180px; height: 200px; pointer-events: none; }
  .btn { position: absolute; width: 62px; height: 62px; border-radius: 50%; pointer-events: auto;
    color: #fff; font-size: 17px; display: flex; align-items: center; justify-content: center; flex-direction: column;
    border: 2px solid rgba(255,255,255,.45); text-shadow: 0 2px 0 #000; line-height: 1.05; }
  .btn small { font-size: 10px; opacity: .8; }
  .btn.on { filter: brightness(1.6); transform: scale(.94); }
  .b-p { right: 80px; bottom: 4px; background: rgba(220,40,50,.55); }
  .b-k { right: 8px; bottom: 44px; background: rgba(240,150,30,.55); }
  .b-s1 { right: 104px; bottom: 76px; background: rgba(40,140,230,.5); width: 54px; height: 54px; font-size: 14px; }
  .b-s2 { right: 30px; bottom: 116px; background: rgba(60,190,120,.5); width: 54px; height: 54px; font-size: 14px; }
  .b-sup { right: 112px; bottom: 146px; background: rgba(255,210,40,.55); width: 46px; height: 46px; font-size: 13px; color: #300; text-shadow: none; }
  .b-start { position: absolute; top: max(env(safe-area-inset-top), 10px); right: max(env(safe-area-inset-right), 10px);
    width: 64px; height: 30px; border-radius: 15px; font-size: 12px; background: rgba(255,255,255,.18); pointer-events: auto; }
  #hint { display: none; position: fixed; left: 0; right: 0; text-align: center; color: #c8c8d4; font-size: 13px; line-height: 1.7; pointer-events: none; }
  body.touch.portrait #hint { display: block; top: calc(var(--cvh, 230px) + 70px); }
  body.touch.portrait .b-start { top: calc(var(--cvh, 230px) + 24px); right: 50%; transform: translateX(50%); }
  #hint b { color: #ffd040; font-weight: normal; }
  #logDlg { font-family: 'Cubic', 'PingFang TC', sans-serif; background: #160006; color: #eee; border: 3px solid #c81e28; border-radius: 6px; max-width: min(520px, 90vw); max-height: 80vh; }
  #logDlg::backdrop { background: rgba(0,0,0,.6); }
  #logDlg > b { color: #ffd040; font-size: 18px; }
  #logDlg h4 { margin: 12px 0 4px; color: #ff6060; }
  #logDlg ul { margin: 0; padding-left: 20px; font-size: 13px; line-height: 1.6; }
  #logDlg button { margin-top: 12px; font: inherit; color: #fff; background: #c81e28; border: 0; border-radius: 4px; padding: 4px 16px; cursor: pointer; }
</style>
</head>
<body>
<dialog id="logDlg"><b>更新紀錄</b><div></div><form method="dialog"><button>關閉</button></form></dialog>
<div id="wrap"><canvas id="game" width="384" height="216"></canvas><div id="mat"></div></div>

<div id="touch">
  <div class="pad" id="pad"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i><div class="knob" id="knob"></div></div>
  <div class="btns">
    <div class="btn b-p" data-b="p">拳<small>P</small></div>
    <div class="btn b-k" data-b="k">腳<small>K</small></div>
    <div class="btn b-s1" data-b="s1">飛彈</div>
    <div class="btn b-s2" data-b="s2">迴旋</div>
    <div class="btn b-sup" data-b="sup">超</div>
  </div>
  <div class="btn b-start" data-b="start">START</div>
</div>

<script src="js/portraits.js?v=18"></script>
<script src="js/sprite_data.js?v=18"></script>
<script src="js/art_data.js?v=18"></script>
<script src="js/product_data.js?v=18"></script>
<script src="js/core.js?v=18"></script>
<script src="js/audio.js?v=18"></script>
<script src="js/sprites.js?v=18"></script>
<script src="js/car.js?v=18"></script>
<script src="js/stage.js?v=18"></script>
<script src="js/game.js?v=18"></script>
</body>
</html>
